name: Petstore API Test Automation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa
          - staging

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      matrix:
        environment: [qa]
      fail-fast: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create logs directory
      run: mkdir -p logs
    
    - name: Run tests with pytest
      env:
        TEST_ENV: ${{ matrix.environment }}
      run: |
        pytest tests/ \
          --env=${{ matrix.environment }} \
          -v \
          --tb=short \
          --html=reports/report-${{ matrix.environment }}.html \
          --self-contained-html \
          --alluredir=allure-results \
          -n auto \
          --junitxml=reports/junit-${{ matrix.environment }}.xml
    
    - name: Generate Allure Report
      if: always()
      run: |
        # Install Allure
        wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
        tar -zxvf allure-2.24.0.tgz
        ./allure-2.24.0/bin/allure generate allure-results --clean -o allure-report
    
    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-${{ matrix.environment }}
        path: |
          reports/
          allure-report/
          logs/
    
    - name: Publish Test Results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: reports/*.xml
        check_name: Test Results (${{ matrix.environment }})
    
    - name: Comment PR with Test Results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## Test Results for ${{ matrix.environment }}\n\nSee attached artifacts for detailed HTML and Allure reports.`
          })

  smoke-test-production:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run Production Smoke Tests
      env:
        TEST_ENV: prod
      run: |
        pytest tests/ \
          --env=prod \
          -m smoke \
          -v \
          --html=reports/smoke-prod.html \
          --self-contained-html
    
    - name: Upload Smoke Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-test-reports
        path: reports/
    
    - name: Notify on Failure
      if: failure()
      run: |
        echo "Production smoke tests failed! Please investigate immediately."
        # Add Slack/email notification here if configured

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install quality tools
      run: |
        pip install flake8 pylint black
    
    - name: Run flake8
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Check code formatting
      run: black --check .
