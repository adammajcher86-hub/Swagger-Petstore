[pytest]
# Pytest configuration for Petstore API Test Automation

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directory to start test discovery
testpaths = tests

# Command line options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# Markers for test categorization
markers =
    smoke: Quick smoke tests for critical functionality
    regression: Full regression test suite
    customer: Customer user journey tests
    manager: Store manager user journey tests
    slow: Tests that take longer to execute

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (optional)
# timeout = 300

# Coverage options (if pytest-cov is installed)
# addopts = --cov=framework --cov-report=html --cov-report=term

# Parallel execution settings
# addopts = -n auto
